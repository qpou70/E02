name: Supervisor visual review L5 pages 08-24

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow
      - name: Render current fourth revision
        run: |
          set -e
          rm -rf /tmp/l5vis supervisor_visual_fourth
          mkdir -p /tmp/l5vis supervisor_visual_fourth
          libreoffice --headless --convert-to pdf --outdir /tmp/l5vis 'l5/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pptx'
          PDF=$(find /tmp/l5vis -maxdepth 1 -name '*.pdf' | head -1)
          pdftoppm -f 8 -l 24 -jpeg -r 144 -jpegopt quality=82 "$PDF" /tmp/l5vis/page >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, shutil
          src=sorted(Path('/tmp/l5vis').glob('page-*.jpg'))
          assert len(src)==17, len(src)
          outdir=Path('supervisor_visual_fourth')
          for i,p in enumerate(src):
              shutil.copy2(p,outdir/f'page_{8+i:02d}.jpg')
          tw,th,lh=360,270,24; cols=4; rows=5
          sheet=Image.new('RGB',(cols*tw,rows*(th+lh)),'white')
          draw=ImageDraw.Draw(sheet)
          try: font=ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',15)
          except: font=None
          for i,p in enumerate(src):
              im=Image.open(p).convert('RGB'); im.thumbnail((tw,th))
              canvas=Image.new('RGB',(tw,th),'white'); canvas.paste(im,((tw-im.width)//2,(th-im.height)//2))
              x=(i%cols)*tw; y=(i//cols)*(th+lh)
              sheet.paste(canvas,(x,y)); draw.text((x+6,y+th+2),f'Page {8+i}',fill='black',font=font)
          sheet.save(outdir/'contact_sheet.jpg','JPEG',quality=78,optimize=True)
          (outdir/'meta.json').write_text(json.dumps({'pages':list(range(8,25)),'source':'fourth revised PPT, LibreOffice render, 144 dpi'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: l5-fourth-visual-review
          path: supervisor_visual_fourth
          retention-days: 3
