name: Run ECE340 L5 stage2 build

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/run-l5-stage2.yml'
      - 'l5/FORCE_L5_STAGE2_MASTER_RUN.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l5-stage2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l5-stage1-strict-rework
          fetch-depth: 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install python-pptx pymupdf pillow lxml
      - name: Build stage2 PPT from accepted stage1 deck
        run: python l5/stage2_builder.py
      - name: Render stage2 evidence
        run: |
          rm -rf l5/stage2_visual_review
          mkdir -p l5/stage2_visual_review/new_pdf
          libreoffice --headless --convert-to pdf --outdir l5/stage2_visual_review/new_pdf \
            'l5/ECE340_L5_S18_Posted_中文忠实重建_第二阶段返修_第8_10_11_14_16_17_19_22_24页.pptx'
          python l5/stage2_evidence.py
      - name: Commit stage2 outputs to working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'l5/ECE340_L5_S18_Posted_中文忠实重建_第二阶段返修_第8_10_11_14_16_17_19_22_24页.pptx' \
            l5/BUILD_REPORT_STAGE2.md \
            l5/stage2_assets \
            l5/stage2_visual_review
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate L5 Stage 2 pages 8 10 11 14 16 17 19 22 24'
            git fetch origin l5-stage1-strict-rework
            git push --force-with-lease origin HEAD:l5-stage1-strict-rework
          fi
