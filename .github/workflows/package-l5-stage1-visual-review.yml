name: Package L5 Stage1 visual review

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/package-l5-stage1-visual-review.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l5-stage1-strict-rework
      - name: Verify committed review evidence
        run: |
          test -f l5/stage1_visual_review_08_24/rendered/page_09.png
          test -f l5/stage1_visual_review_08_24/rendered/page_12.png
          test -f l5/stage1_visual_review_08_24/rendered/page_18.png
          test -f l5/stage1_visual_review_08_24/rendered/page_20.png
          test -f l5/stage1_visual_review_08_24/rendered/page_23.png
          test -f l5/stage1_visual_review_08_24/contact_sheet_stage1_pages_09_12_18_20_23.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: l5-stage1-visual-review
          path: |
            l5/stage1_visual_review_08_24/rendered/page_09.png
            l5/stage1_visual_review_08_24/rendered/page_12.png
            l5/stage1_visual_review_08_24/rendered/page_18.png
            l5/stage1_visual_review_08_24/rendered/page_20.png
            l5/stage1_visual_review_08_24/rendered/page_23.png
            l5/stage1_visual_review_08_24/contact_sheet_stage1_pages_09_12_18_20_23.jpg
          retention-days: 7
