      - name: Render slides and create visual evidence
        run: |
          mkdir -p l5/visual_review_08_24/full l5/visual_review_08_24/high_risk
          libreoffice --headless --convert-to pdf --outdir l5/visual_review_08_24 \
            'l5/ECE340_L5_S18_Posted_中文忠实重建_视觉返修版_第8-24页.pptx'
          python - <<'PY'
          from pathlib import Path
          import fitz, zipfile, hashlib, re
          from PIL import Image, ImageDraw, ImageFont
          ppt=Path('l5/ECE340_L5_S18_Posted_中文忠实重建_视觉返修版_第8-24页.pptx')
          pdf=Path('l5/visual_review_08_24/ECE340_L5_S18_Posted_中文忠实重建_视觉返修版_第8-24页.pdf')
          assert ppt.exists() and pdf.exists()
          doc=fitz.open(pdf); assert doc.page_count==52, doc.page_count
          full=Path('l5/visual_review_08_24/full'); hi=Path('l5/visual_review_08_24/high_risk')
          imgs=[]
          for p in range(8,25):
              page=doc[p-1]
              pix=page.get_pixmap(matrix=fitz.Matrix(120/72,120/72), alpha=False)
              out=full/f'page_{p:02d}.jpg'; pix.save(out); imgs.append(out)
              if p in [8,9,12,16,18,20,23]:
                  shutil_path=hi/f'page_{p:02d}.jpg'
                  shutil_path.write_bytes(out.read_bytes())
          thumbs=[]
          for p in imgs:
              im=Image.open(p).convert('RGB'); im.thumbnail((320,180)); canvas=Image.new('RGB',(340,220),'white'); canvas.paste(im,(10,10)); d=ImageDraw.Draw(canvas); d.text((10,195),p.stem.replace('page_','PDF page '),fill=(0,0,0)); thumbs.append(canvas)
          sheet=Image.new('RGB',(4*340,5*220),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%4)*340,(i//4)*220))
          sheet.save('l5/visual_review_08_24/contact_sheet_08_24.jpg',quality=90)
          with zipfile.ZipFile(ppt) as z:
              slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              notes=[n for n in z.namelist() if n.startswith('ppt/notesSlides/notesSlide') and n.endswith('.xml')]
              assert len(slides)==52 and len(notes)>=52
              for p in range(8,25):
                  xml=z.read(f'ppt/notesSlides/notesSlide{p}.xml').decode('utf-8','ignore')
                  assert '[Sources]' in re.sub('<[^>]+>','',xml), p
          digest=hashlib.sha256(ppt.read_bytes()).hexdigest()
          report=Path('l5/BUILD_REPORT_08_24_VISUAL_REWORK.md').read_text(encoding='utf-8')
          report += '\n'.join([
              f'- LibreOffice PDF render pages: {doc.page_count}',
              '- Rendered JPG evidence: l5/visual_review_08_24/full/page_08.jpg through page_24.jpg',
              '- High-risk rendered pages: 8, 9, 12, 16, 18, 20, 23',
              '- Contact sheet: l5/visual_review_08_24/contact_sheet_08_24.jpg',
              '- Workflow validation: passed',
              f'- Final PPT SHA-256 after validation: `{digest}`',''
          ])
          Path('l5/BUILD_REPORT_08_24_VISUAL_REWORK.md').write_text(report,encoding='utf-8')
          PY
