name: Supervisor inspect visual rework output

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow
      - name: Render visual rework deck pages 8-24
        run: |
          set -e
          rm -rf /tmp/l5vis inspect_visual_rework
          mkdir -p /tmp/l5vis inspect_visual_rework
          libreoffice --headless --convert-to pdf --outdir /tmp/l5vis 'l5/ECE340_L5_S18_Posted_中文忠实重建_视觉返修版_第8-24页.pptx'
          PDF=$(find /tmp/l5vis -maxdepth 1 -name '*.pdf' | head -1)
          pdftoppm -f 8 -l 24 -jpeg -r 144 -jpegopt quality=84 "$PDF" /tmp/l5vis/page >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import shutil
          src=sorted(Path('/tmp/l5vis').glob('page-*.jpg'))
          assert len(src)==17,len(src)
          out=Path('inspect_visual_rework')
          for i,p in enumerate(src): shutil.copy2(p,out/f'page_{8+i:02d}.jpg')
          tw,th,lh=400,300,26; cols=4; rows=5
          sheet=Image.new('RGB',(cols*tw,rows*(th+lh)),'white')
          d=ImageDraw.Draw(sheet)
          try: font=ImageFont.truetype('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',16)
          except: font=None
          for i,p in enumerate(src):
              im=Image.open(p).convert('RGB'); im.thumbnail((tw,th))
              canvas=Image.new('RGB',(tw,th),'white'); canvas.paste(im,((tw-im.width)//2,(th-im.height)//2))
              x=(i%cols)*tw; y=(i//cols)*(th+lh); sheet.paste(canvas,(x,y)); d.text((x+6,y+th+3),f'Page {8+i}',fill='black',font=font)
          sheet.save(out/'contact_sheet.jpg','JPEG',quality=82,optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: visual-rework-inspection
          path: inspect_visual_rework
          retention-days: 3
