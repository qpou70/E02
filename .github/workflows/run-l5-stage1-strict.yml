name: Run ECE340 L5 Final QA R2 page 18

on:
  workflow_dispatch:
  push:
    branches: [l5-stage1-strict-rework]
    paths:
      - '.github/workflows/run-l5-stage1-strict.yml'
      - 'l5/final_qa_r2_page18_caption.py'
      - 'l5/FORCE_L5_STAGE1_STRICT_RUN.txt'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/run-l5-stage1-strict.yml'
      - 'l5/final_qa_r2_page18_caption.py'
      - 'l5/FORCE_L5_STAGE1_STRICT_RUN.txt'

permissions:
  contents: write

concurrency:
  group: l5-final-qa-r2-page18
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l5-stage1-strict-rework
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install python-pptx pymupdf pillow lxml
      - name: Build Final Candidate R2 page 18 evidence
        run: python l5/final_qa_r2_page18_caption.py
      - name: Commit Final Candidate R2 outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Apply ECE340 L5 final QA R2 page 18 caption fix'
            git pull --rebase origin l5-stage1-strict-rework
            git push origin HEAD:l5-stage1-strict-rework
          fi
      - name: Upload Final Candidate R2 artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l5-final-qa-r2-page18
          path: |
            l5/ECE340_L5_S18_Posted_中文忠实重建_最终候选版_R2_第8-24页.pptx
            l5/BUILD_REPORT_FINAL_QA_R2_PAGE18.md
            l5/final_qa_r2_page18/rendered/page_18.png
            l5/final_qa_r2_page18/comparison/page_18_original_pdf_vs_final_candidate_r2.jpg
          retention-days: 7
