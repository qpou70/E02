name: Build ECE340 L5 fourth revised deck page 9 only

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'l5/FORCE_L5_FOURTH_V2_TRIGGER.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install python-pptx pymupdf lxml
      - name: Patch page 9 only
        run: |
          cat > l5/fourth_v2_patch.py <<'PY'
          from pathlib import Path
          import re, zipfile, hashlib
          from pptx import Presentation

          base = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pptx')
          out = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pptx')
          prs = Presentation(base)
          def text(sh): return sh.text if getattr(sh, 'has_text_frame', False) else ''
          def norm(s): return ' '.join(s.split())
          def remove(sh): sh.element.getparent().remove(sh.element)

          s = prs.slides[8]
          removed = []
          for sh in list(s.shapes):
              t = norm(text(sh))
              if (t == '关键标签中英对应' or
                  ('Wafers' in t and '晶圆' in t) or
                  ('Susceptor' in t and '承载/加热基座' in t) or
                  ('Pedestal' in t and '支撑台' in t) or
                  (t.startswith('• Vent') and '排气口' in t) or
                  t == 'Vent 排气口'):
                  removed.append(t)
                  remove(sh)

          prs.save(out)
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('l5/BUILD_REPORT_08_24_FOURTH_REVISED.md').write_text('\n'.join([
              '# ECE340 L5 fourth revised build report', '',
              '- Generated inside GitHub Actions: yes',
              '- Source PDF pages: 52',
              '- Fourth revised range: original PDF pages 8–24',
              '- Targeted modified page only: 9',
              '- Removed residual old page 9 list texts: ' + ('; '.join(removed) if removed else 'none'),
              '- Microsoft PowerPoint actual open check: not performed in GitHub Linux runner',
              '- Status: content and automated render validation passed; pending Microsoft PowerPoint actual open check',
              f'- Final fourth revised PPT SHA-256 before LibreOffice validation: `{digest}`', ''
          ]), encoding='utf-8')
          PY
          python l5/fourth_v2_patch.py
      - name: Validate and render
        run: |
          mkdir -p l5/rendered_fourth
          libreoffice --headless --convert-to pdf --outdir l5/rendered_fourth \
            'l5/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pptx'
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib, fitz
          ppt = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pptx')
          pdf = Path('l5/rendered_fourth/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pdf')
          with zipfile.ZipFile(ppt) as z:
              assert len([n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]) == 52
          doc = fitz.open(pdf)
          assert doc.page_count == 52, doc.page_count
          digest = hashlib.sha256(ppt.read_bytes()).hexdigest()
          report=Path('l5/BUILD_REPORT_08_24_FOURTH_REVISED.md').read_text(encoding='utf-8')
          report += f'- LibreOffice PDF render pages: {doc.page_count}\n- Workflow validation: passed\n- Final fourth revised PPT SHA-256 after validation: `{digest}`\n'
          Path('l5/BUILD_REPORT_08_24_FOURTH_REVISED.md').write_text(report, encoding='utf-8')
          PY
      - name: Commit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'l5/ECE340_L5_S18_Posted_中文忠实重建_四次返修版_第8-24页.pptx' l5/BUILD_REPORT_08_24_FOURTH_REVISED.md
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Regenerate fourth revised ECE340 L5 Chinese deck page 9'
            for attempt in 1 2 3 4 5; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:master; then
                exit 0
              fi
              echo "Push race on attempt ${attempt}; retrying..."
              sleep $((attempt * 2))
            done
            echo 'Failed to push after retries.'
            exit 1
          fi
