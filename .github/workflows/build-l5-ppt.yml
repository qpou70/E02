name: Build ECE340 L5 third revised Chinese PPT pages 08-24

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-l5-ppt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-noto-cjk fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install python-pptx pymupdf lxml
      - name: Apply third revised targeted patch
        run: |
          cat > l5/third_patch.py <<'PY'
          from pathlib import Path
          import re, zipfile, hashlib
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.dml.color import RGBColor
          from pptx.enum.shapes import MSO_SHAPE_TYPE

          base = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_二次返修版_第8-24页.pptx')
          out = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pptx')
          prs = Presentation(base)
          EMU = 914400

          def remove_shape(shape):
              shape.element.getparent().remove(shape.element)

          def shape_text(shape):
              return shape.text if getattr(shape, 'has_text_frame', False) else ''

          def add_box(slide, x, y, w, h, text, size=11, color=(0,0,0), fill=None, bold=False):
              shp = slide.shapes.add_textbox(Inches(x), Inches(y), Inches(w), Inches(h))
              tf = shp.text_frame
              tf.clear(); tf.word_wrap = True
              tf.margin_left = Pt(3); tf.margin_right = Pt(3); tf.margin_top = Pt(1); tf.margin_bottom = Pt(1)
              p = tf.paragraphs[0]
              r = p.add_run(); r.text = text
              r.font.name = 'Microsoft YaHei'; r.font.size = Pt(size); r.font.bold = bold
              r.font.color.rgb = RGBColor(*color)
              if fill is None:
                  shp.fill.background(); shp.line.fill.background()
              else:
                  shp.fill.solid(); shp.fill.fore_color.rgb = RGBColor(*fill)
                  shp.line.color.rgb = RGBColor(*color); shp.line.width = Pt(0.75)
              return shp

          # Page 9: remove the old right-side translation list only; keep the in-figure bilingual labels.
          s = prs.slides[8]
          old_list_keys = [
              '关键标签', '中英对应', 'Gas inlet 气体入口', 'Gas baffle', 'Quartz chamber',
              'Wafers 硅片', 'Susceptor 承载', 'Pedestal 支座', 'Vent 排气口',
              'Radio frequency source', 'RF source 射频'
          ]
          for sh in list(s.shapes):
              t = shape_text(sh)
              x = sh.left / EMU if sh.left is not None else 0
              if t and x > 8.0 and any(k in t for k in old_list_keys):
                  remove_shape(sh)

          # Page 12: restore the page title without touching the accepted diagram labels.
          s = prs.slides[11]
          for sh in list(s.shapes):
              t = shape_text(sh)
              y = sh.top / EMU if sh.top is not None else 99
              if y < 1.0 and ('分子束外延' in t or 'Molecular Beam Epitaxy' in t):
                  remove_shape(sh)
          title = s.shapes.add_textbox(Inches(0.55), Inches(0.28), Inches(9.2), Inches(0.48))
          tf = title.text_frame; tf.clear()
          p = tf.paragraphs[0]
          r = p.add_run(); r.text = '分子束外延（Molecular Beam Epitaxy）'
          r.font.name = 'Microsoft YaHei'; r.font.size = Pt(26); r.font.bold = True
          r.font.color.rgb = RGBColor(0, 50, 110)
          title.fill.background(); title.line.fill.background()

          # Page 19: separate Orbitron image and source URL, with zero geometric overlap.
          s = prs.slides[18]
          for sh in list(s.shapes):
              t = shape_text(sh)
              if 'winter.group.shef' in t or 'orbitron' in t.lower() or '图源：http://winter' in t:
                  remove_shape(sh)
          pictures = [sh for sh in s.shapes if sh.shape_type == MSO_SHAPE_TYPE.PICTURE]
          if pictures:
              pic = max(pictures, key=lambda sh: sh.width * sh.height)
              max_h = Inches(5.15)
              scale = min(1.0, max_h / pic.height)
              new_w = int(pic.width * scale)
              new_h = int(pic.height * scale)
              pic.width = new_w; pic.height = new_h
              pic.left = Inches(1.65); pic.top = Inches(1.22)
              pic_bottom = pic.top + pic.height
          else:
              pic_bottom = Inches(6.35)
          src = add_box(s, 3.15, 6.82, 4.55, 0.28, '图源：http://winter.group.shef.ac.uk/orbitron/', size=11, color=(0,0,0), fill=None, bold=False)
          assert src.top >= pic_bottom + Inches(0.18), (src.top, pic_bottom)

          prs.save(out)

          # Verify unapproved pages in 8-24 are byte-for-byte unchanged at slide XML level.
          unchanged = [p for p in range(8,25) if p not in (9,12,19)]
          with zipfile.ZipFile(base) as zb, zipfile.ZipFile(out) as zo:
              for p in unchanged:
                  a = zb.read(f'ppt/slides/slide{p}.xml')
                  b = zo.read(f'ppt/slides/slide{p}.xml')
                  assert a == b, f'slide {p} changed unexpectedly'
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('l5/BUILD_REPORT_08_24_THIRD_REVISED.md').write_text('\n'.join([
              '# ECE340 L5 third revised build report',
              '',
              '- Generated inside GitHub Actions: yes',
              '- Source PDF pages: 52',
              '- Third revised range: original PDF pages 8–24',
              '- Targeted modified pages only: 9, 12, 19',
              '- Confirmed unchanged slide XML for pages: 8, 10, 11, 13, 14, 15, 16, 17, 18, 20, 21, 22, 23, 24',
              '- PPT slides: 52',
              '- Page 9 duplicate right-side translation list removed',
              '- Page 12 title restored',
              '- Page 19 source URL separated from Orbitron image',
              '- Microsoft PowerPoint actual open check: not performed in GitHub Linux runner',
              '- Status: content and automated render validation passed; pending Microsoft PowerPoint actual open check',
              f'- Final third revised PPT SHA-256 before LibreOffice validation: `{digest}`',
              ''
          ]), encoding='utf-8')
          PY
          python l5/third_patch.py
      - name: Validate third revised PPT and export
        run: |
          mkdir -p l5/rendered_third
          libreoffice --headless --convert-to pdf --outdir l5/rendered_third \
            'l5/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pptx'
          python - <<'PY'
          from pathlib import Path
          import re, zipfile, hashlib, fitz
          ppt = Path('l5/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pptx')
          pdf = Path('l5/rendered_third/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pdf')
          assert ppt.exists(), ppt
          assert pdf.exists(), pdf
          with zipfile.ZipFile(ppt) as z:
              slides = [n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              notes = [n for n in z.namelist() if n.startswith('ppt/notesSlides/notesSlide') and n.endswith('.xml')]
              assert len(slides) == 52, len(slides)
              assert len(notes) >= 52, len(notes)
              bad = []
              banned = ['教师应当','讲解时应','课堂互动建议','本页教学目的','教师需要','建议提问']
              for p in range(8,25):
                  xml = z.read(f'ppt/notesSlides/notesSlide{p}.xml').decode('utf-8','ignore')
                  text = re.sub('<[^>]+>','',xml)
                  if '[Sources]' not in text:
                      bad.append((p,'missing sources'))
                  for phrase in banned:
                      if phrase in text:
                          bad.append((p,'banned',phrase))
                  if p == 20:
                      han = ''.join(re.findall(r'[\u4e00-\u9fff]', text.split('[Sources]')[0]))
                      if len(han) < 400:
                          bad.append((p,'notes_cn_chars',len(han)))
              assert not bad, bad
          doc = fitz.open(pdf)
          assert doc.page_count == 52, doc.page_count
          digest = hashlib.sha256(ppt.read_bytes()).hexdigest()
          report = Path('l5/BUILD_REPORT_08_24_THIRD_REVISED.md').read_text(encoding='utf-8')
          report += f'- LibreOffice PDF render pages: {doc.page_count}\n- Workflow validation: passed\n- Final third revised PPT SHA-256 after validation: `{digest}`\n'
          Path('l5/BUILD_REPORT_08_24_THIRD_REVISED.md').write_text(report, encoding='utf-8')
          PY
      - name: Commit third revised PPT and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'l5/ECE340_L5_S18_Posted_中文忠实重建_三次返修版_第8-24页.pptx' l5/BUILD_REPORT_08_24_THIRD_REVISED.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Regenerate third revised ECE340 L5 Chinese deck pages 8-24'
            git push
          fi
