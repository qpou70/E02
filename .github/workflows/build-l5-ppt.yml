name: Supervisor inspect ECE340 L5 revised pages 08-24

on:
  push:
    branches:
      - 'supervisor/l5-review-revised-08-24'
    paths:
      - '.github/workflows/build-l5-ppt.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pymupdf python-pptx
      - name: Download original lecture PDF
        run: |
          curl -L --fail --retry 3 'https://courses.grainger.illinois.edu/ece340/sp2020/Dallesasse_Slides/ECE340_L5_S18_Posted.pdf' -o /tmp/original.pdf
      - name: Render revised deck and prepare supervisor artifacts
        run: |
          mkdir -p /tmp/rendered l5/supervisor_artifacts
          libreoffice --headless --convert-to pdf --outdir /tmp/rendered 'l5/ECE340_L5_S18_Posted_中文忠实重建_返修版_第8-24页.pptx'
          python - <<'PY'
          from pathlib import Path
          import fitz, re
          from pptx import Presentation

          original = fitz.open('/tmp/original.pdf')
          revised_pdf = next(Path('/tmp/rendered').glob('*.pdf'))
          revised = fitz.open(revised_pdf)
          out = fitz.open()
          for p in range(8,25):
              page = out.new_page(width=1684, height=595)
              page.insert_text((20,20), f'Original PDF page {p}', fontsize=11)
              page.insert_text((862,20), f'Revised PPT slide {p}', fontsize=11)
              page.show_pdf_page(fitz.Rect(0,28,842,595), original, p-1, keep_proportion=True)
              page.show_pdf_page(fitz.Rect(842,28,1684,595), revised, p-1, keep_proportion=True)
          out.save('l5/supervisor_artifacts/L5_revised_compare_pages_08_24.pdf', garbage=4, deflate=True)

          prs = Presentation('l5/ECE340_L5_S18_Posted_中文忠实重建_返修版_第8-24页.pptx')
          rows=[]
          for p in range(8,25):
              slide=prs.slides[p-1]
              note=slide.notes_slide.notes_text_frame.text or ''
              main=note.split('[Sources]')[0]
              han=len(re.findall(r'[\u4e00-\u9fff]',main))
              texts=[]
              for sh in slide.shapes:
                  if getattr(sh,'has_text_frame',False):
                      t=sh.text.strip()
                      if t:
                          texts.append(t)
              rows.append(f'## Slide {p}\n\n**Han chars before [Sources]: {han}**\n\n### Visible slide text\n\n' + '\n\n'.join(texts) + '\n\n### Notes\n\n' + note)
          Path('l5/supervisor_artifacts/L5_revised_slide_text_and_notes_08_24.md').write_text('\n\n---\n\n'.join(rows),encoding='utf-8')
          PY
      - name: Commit supervisor artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- l5/supervisor_artifacts/L5_revised_compare_pages_08_24.pdf l5/supervisor_artifacts/L5_revised_slide_text_and_notes_08_24.md
          if git diff --cached --quiet; then
            echo 'No supervisor artifact changes.'
          else
            git commit -m 'Add supervisor artifacts for revised L5 deck'
            git push
          fi
